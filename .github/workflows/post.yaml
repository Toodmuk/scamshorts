name: Post Short

on:
  schedule:
    - cron: "0 11 * * *"   # 18:00 Bangkok time (GitHub may start a few minutes late)
  workflow_dispatch:        # "Run workflow" button to post right away

permissions:
  contents: write           # save data/posted.json
  actions: read             # download the video made by the morning run

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests==2.33.1

      - name: Download today's video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow daily.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then gh run download "$RUN_ID" --dir artifact; fi

      - name: Post if approved
        env:                # API keys come from GitHub Secrets - see settings.py
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python post.py artifact

      - name: Save post log
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data/posted.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "posted: $(date -u +%F)" && git pull --rebase && git push)
