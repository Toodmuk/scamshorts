name: Check setup

# Run this once after adding your secrets. Costs about $0.01.
# Sends a checklist, a voice sample and a silent sample video to Telegram.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm0 libfribidi0 libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libasound2t64

      - name: Install video renderer (Node)
        run: |
          node --version
          npm ci --prefix web --no-audit --no-fund

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Check everything
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py
